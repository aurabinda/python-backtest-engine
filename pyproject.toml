[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-backtest-engine"
version = "0.1.0"
description = "A small, testable event-driven backtesting engine for systematic trading research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aurabinda" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

